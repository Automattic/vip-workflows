name: Create release PR

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vip-workflow/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        id: release
        run: |
          ./bin/release "${{ inputs.release_type }}"

          VERSION=$(sed -n 's/.*Version: *//p' vip-workflow/vip-workflow.php | head -n 1 | tr -d '[:space:]')
          BRANCH="release/v${VERSION}"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        run: >
          git push --set-upstream origin
          "${{ steps.release.outputs.branch }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-pr-body.md <<'BODY'
          Prepares v${{ steps.release.outputs.version }} for review.

          Release type: ${{ inputs.release_type }}
          Generated by: Create release PR workflow

          Merging this PR into main starts the release workflow, which creates
          the GitHub release and attaches the production VIP Workflow plugin.
          BODY

          gh pr create \
            --base main \
            --head "${{ steps.release.outputs.branch }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --body-file release-pr-body.md
