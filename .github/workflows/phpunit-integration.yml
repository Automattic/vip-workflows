name: PHPUnit Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          npm ci
          composer --working-dir=vip-workflow install --no-interaction --prefer-dist --no-progress
          composer --working-dir=workflow-parsely install --no-interaction --prefer-dist --no-progress

      - name: Start WordPress test environment
        run: npm run wp-env:start:tests

      - name: Run integration tests
        run: npm run test:php:integration

      - name: Stop WordPress test environment
        if: always()
        run: npm run wp-env:stop:tests
