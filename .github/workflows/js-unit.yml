name: JavaScript

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  javascript:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vip-workflows/package-lock.json
            workflow-tool-checklist/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix vip-workflows ci
          npm --prefix workflow-tool-checklist ci

      - name: Run tooling tests
        run: npm run test:tools

      - name: Run linters
        run: |
          npm run lint:all
          npm --prefix vip-workflows run lint:js
          npm --prefix vip-workflows run lint:css
          npm --prefix workflow-tool-checklist run lint:js
          npm --prefix workflow-tool-checklist run lint:css

      - name: Run JavaScript unit tests
        run: npm --prefix vip-workflows run test:unit:js
