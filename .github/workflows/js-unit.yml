name: JavaScript

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  javascript:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vip-workflow/package-lock.json
            workflow-tool-checklist/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix vip-workflow ci
          npm --prefix workflow-tool-checklist ci

      - name: Run tooling tests
        run: npm run test:tools

      - name: Run linters
        run: |
          npm run lint:all
          npm --prefix vip-workflow run lint:js
          npm --prefix vip-workflow run lint:css
          npm --prefix workflow-tool-checklist run lint:js
          npm --prefix workflow-tool-checklist run lint:css

      - name: Run JavaScript unit tests
        run: npm --prefix vip-workflow run test:unit:js
