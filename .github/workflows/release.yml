name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version_check
        run: |
          OLD_VERSION=$(git show HEAD^:vip-workflow/vip-workflow.php 2>/dev/null | sed -n 's/.*Version: *//p' | head -n 1 | tr -d '[:space:]')
          NEW_VERSION=$(git show HEAD:vip-workflow/vip-workflow.php | sed -n 's/.*Version: *//p' | head -n 1 | tr -d '[:space:]')
          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "No version change detected"
            exit 0
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version changed from $OLD_VERSION to $NEW_VERSION"

      - name: Setup PHP
        if: steps.version_check.outputs.new_version
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'

      - name: Setup Node
        if: steps.version_check.outputs.new_version
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vip-workflow/package-lock.json

      - name: Build plugin zip
        if: steps.version_check.outputs.new_version
        run: >
          ./tools/package-plugin.sh
          "${{ steps.version_check.outputs.new_version }}"
          vip-workflow

      - name: Create release
        if: steps.version_check.outputs.new_version
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ steps.version_check.outputs.new_version }}
          files: dist/vip-workflow-${{ steps.version_check.outputs.new_version }}.zip
          generate_release_notes: true
