name: PR Preview - Build

# Builds the core plugin and demo content from pull request code with
# tools/playground/build-preview.sh and bundles them with the blueprint
# generated from .playground/blueprint.json. Runs with read-only permissions;
# "PR Preview - Publish" hosts the result and adds the Preview button to the
# pull request description.
#
# `edited` re-runs the build when the description is replaced, so publish can
# restore a Preview button that the edit removed. Publish edits the
# description with GITHUB_TOKEN, which does not trigger workflows.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4
    with:
      node-version: '22'
      php-version: '8.2'
      # Keep in step with ARTIFACTS in tools/playground/build-preview.sh.
      artifacts: |
        vip-workflows=dist/preview/vip-workflows.zip
        demo-content=dist/preview/demo-content.zip
      blueprint-from-build: dist/preview/blueprint.json
      build-command: |
        set -euo pipefail

        # Stamp a prerelease version so the Plugins screen shows which pull
        # request and commit the preview is running.
        base_version="$(sed -n 's/.*Version: *//p' vip-workflows/vip-workflows.php | head -n 1 | tr -d '[:space:]')"
        head_sha="${{ github.event.pull_request.head.sha }}"

        ./tools/playground/build-preview.sh "${base_version}-pr.${{ github.event.pull_request.number }}.${head_sha:0:7}"
