name: PR Preview - Publish

# Runs from the default branch with write access and never checks out pull
# request code. Uploads the zips built by "PR Preview - Build" to the public
# ci-artifacts prerelease, fills the artifact URLs into the bundled blueprint,
# and adds the Preview in WordPress Playground button to the PR description.
#
# workflow_run always reads this file from the default branch, so changes here
# take effect only after they merge.

on:
  workflow_run:
    workflows: ['PR Preview - Build']
    types: [completed]

jobs:
  publish:
    # Fork pull requests build with their own workflow and scripts; only
    # branches in this repository get their zips hosted under it.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4
    with:
      blueprint-from-artifact: true
      artifacts-to-keep: '2'
