name: PR Preview - Cleanup

# Deletes a closed pull request's preview zips from the ci-artifacts
# prerelease. Publish only prunes a PR's older commits when that PR publishes
# again, and a release holds at most 1000 assets.
#
# pull_request_target runs this file from the default branch and never checks
# out pull request code.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! assets="$(gh release view ci-artifacts --json assets --jq ".assets[].name | select(startswith(\"pr-${PR_NUMBER}-\"))" 2>error.log)"; then
            if grep -q 'release not found' error.log; then
              echo "No ci-artifacts release; nothing to clean up."
              exit 0
            fi
            cat error.log >&2
            exit 1
          fi

          if [ -z "$assets" ]; then
            echo "No preview assets for #${PR_NUMBER}."
            exit 0
          fi

          while IFS= read -r name; do
            echo "Deleting ${name}"
            gh release delete-asset ci-artifacts "$name" --yes
          done <<< "$assets"
