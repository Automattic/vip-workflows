name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vip-workflow/package-lock.json
            workflow-tool-checklist/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci
          npm --prefix vip-workflow ci
          npm --prefix workflow-tool-checklist ci
          composer --working-dir=vip-workflow install --no-interaction --prefer-dist --no-progress
          composer --working-dir=workflow-parsely install --no-interaction --prefer-dist --no-progress

      - name: Build plugins
        run: npm run build

      - name: Install Playwright browser
        working-directory: vip-workflow
        run: npx playwright install chromium --with-deps

      - name: Start WordPress test environment
        run: npm run wp-env:start:tests

      - name: Run end-to-end tests
        working-directory: vip-workflow
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: vip-workflow/artifacts
          if-no-files-found: ignore

      - name: Stop WordPress test environment
        if: always()
        run: npm run wp-env:stop:tests
